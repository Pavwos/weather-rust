[package]
name = "clima"
version = "0.2.1"
description = "Aplicativo pessoal de clima"
edition = "2021"

[lib]
name = "clima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clima"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
